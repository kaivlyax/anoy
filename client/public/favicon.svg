<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0a5c05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF9933" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Atmospheric Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Iconic ANOY 'A' Glyph + Tricolor Plume -->
  <g transform="translate(10, 12)">
    <!-- Bold 'A' Letterform -->
    <path
      d="M5 38 L18 4 L26 4 L39 38 L29 38 L26 28 L18 28 L15 38 Z M20 21 L24 21 L22 13 Z"
      fill="url(#textGrad)"
      fill-rule="evenodd"
    />

    <!-- Saffron Center Dot -->
    <circle cx="22" cy="21" r="3.2" fill="url(#saffronGrad)" filter="url(#glow)" />
    <circle cx="22" cy="21" r="1.2" fill="#FFFFFF" />

    <!-- Indian Tricolor Feather / Plume -->
    <g transform="translate(25, 0)">
      <!-- Saffron Top Plume -->
      <path d="M0 9 C4 4, 11 1, 16 1 C12 6, 8 9, 2 11 Z" fill="url(#saffronGrad)" />
      <!-- White Middle Plume with Navy Chakra dot -->
      <path d="M2 10 C6 6, 13 4, 18 4 C14 9, 10 12, 4 13 Z" fill="#FFFFFF" />
      <circle cx="10" cy="8" r="1.2" fill="#000080" />
      <!-- Green Bottom Plume -->
      <path d="M3 12 C7 9, 14 7, 20 8 C15 12, 11 15, 5 15 Z" fill="url(#greenGrad)" />
    </g>
  </g>
</svg>